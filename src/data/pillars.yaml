# The six research pillars: who acts, where and when, what moves, by which
# rules, how we know, and why. Owned here as data; the research pages and the
# homepage constellation both read this file.
- id: agents
  index: 1
  title: Agents
  description: >-
    Who acts: decision-makers that learn, adapt and decide, from agent-based models and multi-agent
    reinforcement learning to LLM-based agents and the algorithms now active in markets.
  detailed_text: >-
    Economic outcomes emerge from the choices of many heterogeneous decision-makers: households,
    firms, banks, regulators and, increasingly, algorithms. This pillar asks which behavior a model
    should assume and how that behavior changes when the environment does. It combines agent-based
    models with bounded rationality and heuristic rules, multi-agent reinforcement learning, and
    agents that reason with large language models, to study how local adaptation shapes aggregate
    dynamics.
  topics:
    - Agent-Based Modeling
    - Multi-Agent Reinforcement Learning
    - LLM-Based Agents
  title_it: Agenti
  description_it: >-
    Chi agisce: decisori che apprendono, si adattano e scelgono, dai modelli ad agenti e
    dall'apprendimento per rinforzo multi-agente fino agli agenti basati su LLM e agli algoritmi
    ormai attivi sui mercati.
  detailed_text_it: >-
    Gli esiti economici emergono dalle scelte di molti decisori eterogenei: famiglie, imprese,
    banche, regolatori e, sempre più spesso, algoritmi. Questo pilastro si chiede quale
    comportamento un modello debba assumere e come quel comportamento cambi quando cambia
    l'ambiente. Combina modelli ad agenti con razionalità limitata e regole euristiche,
    apprendimento per rinforzo multi-agente e agenti che ragionano con modelli linguistici di
    grandi dimensioni, per studiare come l'adattamento locale plasmi le dinamiche aggregate.
  topics_it:
    - Modellazione ad Agenti
    - Apprendimento per Rinforzo Multi-Agente
    - Agenti Basati su LLM
  projects:
    - multi-agent-orchestration
    - real-estate-ai-agent
- id: world
  index: 2
  title: World
  description: >-
    Where and when: the structure in which agents act and how it evolves, from networks and
    higher-order interactions to geography.
  detailed_text: >-
    Agents do not interact at random. They are linked by credit, trade, ownership and information,
    often in groups rather than in pairs, and they live in places exposed to different risks. This
    pillar treats space and time as a single object: the structure of these connections together
    with its evolution, as networks form, rewire and pass through regime shifts and transitions.
    The tools are network science, higher-order networks and graph machine learning.
  topics:
    - Network Science
    - Higher-Order Networks
    - Graph Machine Learning
  title_it: Mondo
  description_it: >-
    Dove e quando: la struttura in cui gli agenti agiscono e come evolve, dalle reti e dalle
    interazioni di ordine superiore fino alla geografia.
  detailed_text_it: >-
    Gli agenti non interagiscono a caso. Sono legati da credito, commercio, proprietà e
    informazione, spesso in gruppi e non solo in coppie, e vivono in luoghi esposti a rischi
    diversi. Questo pilastro tratta spazio e tempo come un unico oggetto: la struttura di questi
    legami insieme alla sua evoluzione, mentre le reti si formano, si riconfigurano e attraversano
    cambi di regime e transizioni. Gli strumenti sono la scienza delle reti, le reti di ordine
    superiore e il machine learning su grafi.
  topics_it:
    - Scienza delle Reti
    - Reti di Ordine Superiore
    - Machine Learning su Grafi
  projects:
    - network-crash-prediction
- id: flows
  index: 3
  title: Flows
  description: >-
    What moves: credit and liquidity, information and narratives, and physical flows such as
    temperature and water, and how they form, spread and amplify.
  detailed_text: >-
    A flow is any quantity that moves or evolves through the system. Economic flows include credit,
    liquidity and trade; informational flows include news and the narratives that drive decisions;
    physical flows include temperature, water and energy. This pillar traces how flows propagate
    through the structure of the world, how shocks spread and amplify, and how text becomes a
    measurable signal, using time-series and functional data analysis, network science and text
    analytics.
  topics:
    - Time Series and Functional Data
    - Financial Contagion
    - Text Analytics
  title_it: Flussi
  description_it: >-
    Che cosa si muove: credito e liquidità, informazione e narrative, e flussi fisici come
    temperatura e acqua, e come si formano, si propagano e si amplificano.
  detailed_text_it: >-
    Un flusso è qualsiasi grandezza che si muove o evolve nel sistema. I flussi economici
    comprendono credito, liquidità e commercio; quelli informativi le notizie e le narrative che
    orientano le decisioni; quelli fisici temperatura, acqua ed energia. Questo pilastro segue
    come i flussi si propagano nella struttura del mondo, come gli shock si diffondono e si
    amplificano, e come il testo diventa un segnale misurabile, con l'analisi di serie storiche e
    di dati funzionali, la scienza delle reti e l'analisi testuale.
  topics_it:
    - Serie Storiche e Dati Funzionali
    - Contagio Finanziario
    - Analisi Testuale
  projects:
    - risk-sentinel
    - gas-network-risk-forecasting
    - nlp-semantic-network-analysis
- id: rules
  index: 4
  title: Rules
  description: >-
    How they interact: the institutions, markets, contracts and policies that govern interaction.
    An intervention is a change of rules, and agents adapt to it.
  detailed_text: >-
    Markets, contracts, regulation and policy set the terms on which agents interact. Unlike the
    rest of the system, rules are what people deliberately change, and agents respond by adapting,
    so a conclusion drawn under one set of rules can fail under the next. This pillar models
    mechanisms explicitly: how institutional design shapes outcomes, and how to represent an
    intervention as a change of rules rather than as a shock to a fixed system.
  topics:
    - Institutions
    - Market Mechanisms
    - Policy Interventions
  title_it: Regole
  description_it: >-
    Come interagiscono: le istituzioni, i mercati, i contratti e le politiche che governano
    l'interazione. Un intervento è un cambio di regole, e gli agenti vi si adattano.
  detailed_text_it: >-
    Mercati, contratti, regolazione e politiche fissano i termini in cui gli agenti interagiscono.
    A differenza del resto del sistema, le regole sono ciò che le persone cambiano
    deliberatamente, e gli agenti rispondono adattandosi: una conclusione tratta sotto un insieme
    di regole può non valere sotto il successivo. Questo pilastro modella i meccanismi in modo
    esplicito: come il disegno istituzionale determina gli esiti, e come rappresentare un
    intervento come un cambio di regole e non come uno shock a un sistema fisso.
  topics_it:
    - Istituzioni
    - Meccanismi di Mercato
    - Interventi di Policy
- id: trust
  index: 5
  title: Trust
  description: >-
    How we know: data, statistics and verification to establish which conclusions a model can
    support, comparing rival models and testing results under a change of method, data or policy.
  detailed_text: >-
    A handful of simulation runs, or a single fitted model, is not yet evidence. This pillar
    combines data, robust and high-dimensional statistics, causal inference, statistical model
    checking and formal verification to attach quantified confidence to what models imply. It
    compares rival models that fit the same data, and tests whether a conclusion survives a change
    of method, of data or of the policy itself, including whether what a corpus says depends on
    the technique used to read it.
  topics:
    - Statistical Model Checking
    - Robust Statistics
    - Causal Inference
  title_it: Affidabilità
  description_it: >-
    Come lo sappiamo: dati, statistica e verifica per stabilire quali conclusioni un modello può
    sostenere, confrontando modelli rivali e mettendo alla prova i risultati al cambiare di
    metodo, dati o politica.
  detailed_text_it: >-
    Qualche esecuzione di una simulazione, o un singolo modello stimato, non è ancora evidenza.
    Questo pilastro combina dati, statistica robusta e ad alta dimensionalità, inferenza causale,
    statistical model checking e verifica formale per associare una confidenza quantificata a ciò
    che i modelli implicano. Confronta modelli rivali che si adattano agli stessi dati e verifica
    se una conclusione regge al cambiare del metodo, dei dati o della politica stessa, compreso il
    caso in cui ciò che dice un corpus dipende dalla tecnica usata per leggerlo.
  topics_it:
    - Statistical Model Checking
    - Statistica Robusta
    - Inferenza Causale
  projects:
    - island-model-smc
    - robust-portfolio-optimization
- id: purpose
  index: 6
  title: Purpose
  description: >-
    Why and for whom: decisions that stay sound when the system responds, and attention to who
    gains, who pays and who bears the risk.
  detailed_text: >-
    Models matter when they inform decisions, from policy to risk management. A sound decision has
    to hold once the system responds, including to the model itself, when forecasts, ratings and
    algorithms change the behavior they describe. This pillar also asks how outcomes are
    distributed: who gains, who pays and who bears the risk, as in how the losses from natural
    disasters are shared.
  topics:
    - Decision Support
    - Risk Sharing
    - Distributional Impacts
  title_it: Scopo
  description_it: >-
    Perché e per chi: decisioni che restano solide quando il sistema reagisce, e attenzione a chi
    guadagna, chi paga e chi sopporta il rischio.
  detailed_text_it: >-
    I modelli contano quando orientano le decisioni, dalle politiche pubbliche alla gestione del
    rischio. Una decisione solida deve reggere quando il sistema reagisce, anche al modello
    stesso, quando previsioni, rating e algoritmi cambiano il comportamento che descrivono. Questo
    pilastro si chiede anche come si distribuiscono gli esiti: chi guadagna, chi paga e chi
    sopporta il rischio, come nella ripartizione delle perdite causate dai disastri naturali.
  topics_it:
    - Supporto alle Decisioni
    - Condivisione del Rischio
    - Impatti Distributivi
